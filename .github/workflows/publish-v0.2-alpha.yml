name: Publish v0.2.0-alpha.1

# One-shot, version-specific publishing workflow. It only runs when the
# release-notes file is introduced/changed by a push to the default branch.
on:
  push:
    branches: [main]
    paths:
      - RELEASE_NOTES_v0.2.0-alpha.1.md

permissions:
  contents: write

concurrency:
  group: publish-v0.2.0-alpha.1
  cancel-in-progress: false

jobs:
  verify-and-publish:
    if: github.repository == 'KomchanV/explainable-network-ids'
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
      TAG: v0.2.0-alpha.1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-api.txt
          pnpm install --frozen-lockfile
      - name: Verify scientific, API and frontend checks
        run: pnpm nx run-many -t check,test,build --parallel=2 --output-style=static
      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Verify browser workflows
        run: pnpm nx e2e web --output-style=static
      - name: Verify version and release materials
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "0.2.0-alpha.1"
          test -s RELEASE_NOTES_v0.2.0-alpha.1.md
          grep -Fq '## [0.2.0-alpha.1]' CHANGELOG.md
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Publish annotated tag and GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          # Never move a tag or rewrite an existing release.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Refusing to overwrite it."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Refusing to overwrite it."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG: offline model insights, traffic analysis and SHAP"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" \
            --verify-tag \
            --prerelease \
            --title "v0.2.0-alpha.1 — Explainable Network IDS" \
            --notes-file RELEASE_NOTES_v0.2.0-alpha.1.md
      - name: Confirm published release points to verified commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          gh release view "$TAG" --json tagName,isPrerelease,url --jq '.'
